audit:
  kind: source_backed_incremental_delta
  comparison: "Clio candidate 6576485 against Hermes 6f31cfad; portable behavior is implemented natively and service-specific or visual-only changes are recorded as exclusions"
  inherited_ledger_note: Broad capability rows below were delivered before this delta; the full frozen-candidate suite remains the release gate.
  exclusions:
    - Nous billing, subscription, top-up, keyless vendor relay, and branding
    - Nous relay transport and live-card protocol without a shipped Clio relay equivalent
    - Visual-only themes, glass/material styling, accent retinting, and HUD layout without a shipped Clio equivalent
  evidence:
    - "Hermes: first-parent log and focused source diff for de322448..6f31cfad (243 commits)"
    - "Clio: git log 6e5a6353..6576485 plus focused source/test inspection"
    - "Detailed prior audit: hermes-clio-parity-plan-2026-08-20.md at Hermes 449471c"
migration_rules:
  - Preserve Agentic Fusion, Gmail, music generation, ACP delegation overrides, cross-profile cron, managed provider, Portal, ComfyUI, Vidu, and Clio branding.
  - Port portable behavior rather than Nous-specific commercial endpoints or branding.
  - Keep old config, plugin manifests, state databases, and public imports compatible through additive migrations and adapters.
  - Require focused tests, migration notes, and a full-suite result before marking a capability ported.
  - Do not restart the running gateway during implementation or verification.
