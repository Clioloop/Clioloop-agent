  - id: profile-bot-routing-and-peers
    status: matched-clio-equivalent
    summary: Clio routes authenticated Bot roster, DMs, rooms, and attachment transfer directly by profile, with collision-safe multi-peer inventories and explicit offline errors instead of a generic /p/<profile> mirror.
    evidence: [clio_bot_mode.py, gateway/platforms/api_server.py, clio_cli/bot_mode.py]
  - id: desktop-session-owner-routing
    status: matched-clio-equivalent
    upstream_revisions: [ae6578af, d57f94a3, 3a50a6be]
    local_revisions: [26f7ee6d]
    summary: Profile activation fails closed, session RPCs route through their owning profile gateway, and Bot Chat wake waits for the owning backend.
    evidence: [apps/desktop/src/store/session-request-router.ts, apps/desktop/src/store/gateway.ts, apps/desktop/src/store/profile.ts]
  - id: desktop-multi-connection-aggregation-and-updates
    status: partial
    summary: Stable connection/profile route keys and owner-pinned session calls exist; Hermes's unified all-gateway session aggregation, remote-project scan, and update-every-target UI are not fully exposed in the shipped Clio renderer.
    evidence: [apps/desktop/src/desktop/backend-foundations.ts, apps/desktop/src/store/session-request-router.ts]
  - id: generic-gateway-profile-multiplex
    status: partial-intentional
    summary: Bot and Desktop session routes are profile-aware; Clio intentionally retains isolated profile gateways rather than mirroring every sessions/cron/platform route under one multi-tenant process.
    evidence: [gateway/profile_routing.py, clio_bot_mode.py]
  - id: a2a-tool-schema-follow-up
    status: not-applicable
    upstream_revisions: [cefeed4c]
    summary: The Hermes regression is in its A2A client-tool describe layer; Clio currently ships only the minimal A2A platform bridge and has no equivalent wrapper schema to repair.
  - id: nous-relay-and-keyless-vendor-ring
    status: excluded-service-specific
    summary: Nous relay/live-card protocol and the Nous-operated keyless Exa/Parallel/Tavily/Firecrawl/Keenable ring are not portable. Clio keeps its Portal-managed and direct-provider paths.
  - id: desktop-themes-glass-hud
    status: excluded-visual-only
    summary: Hermes-only themes, accent retinting, glass/material tuning, and HUD layouts have no Clio product-equivalent behavior requirement.
  - id: terminal-overlay-unfocused-tab-switch
    status: matched-clio-equivalent
    summary: Clio conditionally unmounts its TerminalSlot and clears overlay routing when the sidebar tab changes, so Hermes's hidden-pane sampling patch is unnecessary.
    evidence: [apps/desktop/src/app/right-sidebar/index.tsx, apps/desktop/src/app/right-sidebar/terminal/persistent.tsx]

