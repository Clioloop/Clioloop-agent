    status: matched-clio-equivalent
    upstream_revisions: [ad7a14a5, d604ba65, b359db72]
    local_revisions: [5e1bc48c, 7888c323, 6576485b]
    summary: Durable Bot identities survive profile renames, worker sessions light the roster without hiding ordinary sessions, and bounded attachments are staged independently for local and authenticated remote members with a Desktop picker/drop surface.
